name: Build TikTok LSPosed APK

on:
  push:
    branches:
      - tiktok-lsposed-build
    paths:
      - 'tiktok-lsposed/**'
      - '.github/workflows/tiktok-lsposed-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Unpack and verify module sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tiktok-lsposed/work
          cat tiktok-lsposed/source.part1.b64 tiktok-lsposed/source.part2.b64 | base64 -d > tiktok-lsposed/project.tar.xz
          echo "45b05fce2f5da7b708c9f00abfce8265c1100972783a6795e1eba21c0cedb71a  tiktok-lsposed/project.tar.xz" | sha256sum -c -
          tar -xJf tiktok-lsposed/project.tar.xz -C tiktok-lsposed/work
          test -f tiktok-lsposed/work/app/libs/xposed-compile-only.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check cache cleanup safety
        run: bash tests/test-cache.sh
        working-directory: tiktok-lsposed/work

      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
        working-directory: tiktok-lsposed/work

      - name: Verify APK exists
        run: |
          set -euo pipefail
          file tiktok-lsposed/work/app/build/outputs/apk/debug/app-debug.apk
          sha256sum tiktok-lsposed/work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-LSPosed-Optimizer-APK
          path: tiktok-lsposed/work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
